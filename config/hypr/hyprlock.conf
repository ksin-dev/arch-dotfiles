background {
    monitor =
    color = rgba(1a1b26ff)
}

input-field {
    monitor =
    size = 280, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(24283bff)
    font_color = rgba(c0caf5ff)
    fade_on_empty = false
    placeholder_text = Password
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(c0caf5ff)
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}
