###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# @group Apps
bind = $mainMod, Return, exec, $terminal # help: Open terminal
bind = $mainMod CTRL, escape, exec, ~/.local/bin/hypr-btop # help: Open btop
bind = $mainMod, E, exec,[float;size 80% 70%;center] kitty -e $fileManager # help: Open terminal file manager
bind = $mainMod SHIFT, E, exec, [float;size 80% 70%;center] $guiFileManager # help: Open GUI file manager
bind = $mainMod, Space, exec, $menu # help: Open app launcher
bind = $mainMod SHIFT, slash, exec, ~/.local/bin/qs-toggle-keybinds # help: Show keyboard shortcuts
bind = $mainMod SHIFT, question, exec, ~/.local/bin/qs-toggle-keybinds
bind = $mainMod, P, exec, ~/.local/bin/hypr-monitor-cycle # help: Cycle display mode
bind = $mainMod SHIFT, P, exec, ~/.local/bin/qs-monitor-settings # help: Open display settings

# @group Windows
bind = $mainMod, Q, killactive, # help: Close active window
bind = $mainMod SHIFT, Q, exec, sh -c 'pid=$(hyprctl activewindow -j | jq -r ".pid"); [ -n "$pid" ] && [ "$pid" != "null" ] && kill -KILL "$pid"' # help: Force-kill active window
bind = $mainMod, V, togglefloating, # help: Toggle floating
bind = $mainMod ALT, P, pseudo, # help: Toggle pseudo tiling
#bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l # help: Move focus left
bind = $mainMod, right, movefocus, r # help: Move focus right
bind = $mainMod, up, movefocus, u # help: Move focus up
bind = $mainMod, down, movefocus, d # help: Move focus down
bind = $mainMod, h, movefocus, l # help: Move focus left
bind = $mainMod, l, movefocus, r # help: Move focus right
bind = $mainMod, k, movefocus, u # help: Move focus up
bind = $mainMod, j, movefocus, d # help: Move focus down

# overview:toggle is plugin-dependent and fails config validation when unavailable.
# bind = $mainMod SHIFT, Tab, overview:toggle # help: Toggle overview
bind = $mainMod, Tab, cyclenext # help: Cycle next window
bind = $mainMod, F,fullscreen, # help: Toggle fullscreen

# @group Window layouts
bind = $mainMod ALT, W, submap, window_layout # help: Toggle window layout mode

submap = window_layout

bind = $mainMod ALT, W, submap, reset # help: Exit window layout mode
bind = , 1, exec, ~/.config/hypr/master-layout.sh top # help: Layout 1: main top
bind = , 2, exec, ~/.config/hypr/master-layout.sh left # help: Layout 2: main left
bind = , 3, exec, ~/.config/hypr/master-layout.sh right # help: Layout 3: main right
bind = , 4, exec, ~/.config/hypr/dwindle-layout.sh # help: Layout 4: dwindle
bind = , 5, exec, ~/.config/hypr/master-layout.sh top all # help: Layout 5: equal horizontal split
bind = , left, movefocus, l # help: Move focus left
bind = , right, movefocus, r # help: Move focus right
bind = , up, movefocus, u # help: Move focus up
bind = , down, movefocus, d # help: Move focus down
bind = , h, movefocus, l # help: Move focus left
bind = , l, movefocus, r # help: Move focus right
bind = , k, movefocus, u # help: Move focus up
bind = , j, movefocus, d # help: Move focus down
bind = , m, exec, ~/.config/hypr/set-master-window.sh # help: Set focused window as master
bind = , escape, submap, reset # help: Exit window layout mode

submap = reset

# @group Music
bind = $mainMod ALT, M, submap, music # help: Toggle music mode

# Start a submap called "music".
submap = music

bind = $mainMod ALT, M, submap, reset # help: Exit music mode
bindel = , k, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # help: Increase volume
bindel = , up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # help: Increase volume
bindel = , j, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # help: Decrease volume
bindel = , down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # help: Decrease volume
bindl = , l, exec, playerctl next # help: Next media track
bindl = , right, exec, playerctl next # help: Next media track
bindl = , h, exec, playerctl previous # help: Previous media track
bindl = , left, exec, playerctl previous # help: Previous media track
bindl = , space, exec, playerctl play-pause # help: Toggle media playback
bindl = , s, exec, playerctl shuffle Toggle # help: Toggle shuffle
bindl = , r, exec, sh -c 'state=$(playerctl loop 2>/dev/null || true); if [ "$state" = Playlist ]; then playerctl loop None; else playerctl loop Playlist; fi' # help: Toggle repeat playlist
bind = , escape, submap, reset # help: Exit music mode

submap = reset

# Switch to a submap called `resize`.
bind = $mainMod ALT, R, submap, resize # help: Toggle resize mode

# Start a submap called "resize".
submap = resize

bind = $mainMod ALT, R, submap, reset # help: Exit resize mode
# Set repeatable binds for resizing the active window.
binde = , right, resizeactive, 10 0 # help: Resize active window right
binde = , left, resizeactive, -10 0 # help: Resize active window left
binde = , up, resizeactive, 0 -10 # help: Resize active window up
binde = , down, resizeactive, 0 10 # help: Resize active window down
binde = , l, resizeactive, 10 0 # help: Resize active window right
binde = , h, resizeactive, -10 0 # help: Resize active window left
binde = , k, resizeactive, 0 -10 # help: Resize active window up
binde = , j, resizeactive, 0 10 # help: Resize active window down

# Use `reset` to go back to the global submap
bind = , escape, submap, reset # help: Exit resize mode

# Reset the submap, which will return to the global submap
submap = reset

# Keybinds further down will be global again...


# Switch workspaces with mainMod + [0-9]
# @group Workspaces
bind = $mainMod, 1, exec, ~/.config/hypr/workspace-layout.sh 1 # help: Switch to workspace 1
bind = $mainMod, 2, exec, ~/.config/hypr/workspace-layout.sh 2 # help: Switch to workspace 2
bind = $mainMod, 3, exec, ~/.config/hypr/workspace-layout.sh 3 # help: Switch to workspace 3
bind = $mainMod, 4, exec, ~/.config/hypr/workspace-layout.sh 4 # help: Switch to workspace 4
bind = $mainMod, 5, exec, ~/.config/hypr/workspace-layout.sh 5 # help: Switch to workspace 5
bind = $mainMod, 6, exec, ~/.config/hypr/workspace-layout.sh 6 # help: Switch to workspace 6
bind = $mainMod, 7, exec, ~/.config/hypr/workspace-layout.sh 7 # help: Switch to workspace 7
bind = $mainMod, 8, exec, ~/.config/hypr/workspace-layout.sh 8 # help: Switch to workspace 8
bind = $mainMod, 9, exec, ~/.config/hypr/workspace-layout.sh 9 # help: Switch to workspace 9
bind = $mainMod, 0, exec, ~/.config/hypr/workspace-layout.sh 10 # help: Switch to workspace 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1 # help: Move window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # help: Move window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # help: Move window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # help: Move window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # help: Move window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 # help: Move window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 # help: Move window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 # help: Move window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 # help: Move window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # help: Move window to workspace 10

# Example special workspace (scratchpad)
bind = $mainMod, Z, togglespecialworkspace, magic # help: Toggle scratchpad workspace
bind = $mainMod SHIFT, Z, movetoworkspace, special:magic # help: Move window to scratchpad

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1 # help: Switch to next workspace
bind = $mainMod, mouse_up, workspace, e-1 # help: Switch to previous workspace

# scrinshot
# @group Screenshots
bind = $mainMod, S, exec, sh -c 'grim -g "$(hyprctl activewindow -j | jq -r "\"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])\"")" - | swappy -f -' # help: Screenshot active window
bind = $mainMod SHIFT, S, exec, sh -c 'grim -g "$(slurp -d)" - | swappy -f -' # help: Screenshot selected region

# hangul
# @group System
bind = $mainMod SHIFT, L, exec, sh -c 'if command -v hyprlock >/dev/null 2>&1; then pidof hyprlock >/dev/null 2>&1 || hyprlock; else loginctl lock-session; fi' # help: Lock session
bind = $mainMod CTRL, Q, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit # help: Logout or shutdown
bind = ,ALT_R,exec, fcitx5-remote -t # help: Toggle Korean input
bind = ,Hangul,exec, fcitx5-remote -t
bind = ,ISO_Level3_Shift,exec, fcitx5-remote -t

# Move/resize windows with mainMod + LMB/RMB and dragging
# @group Mouse
bindm = $mainMod, mouse:272, movewindow # help: Move window by dragging
bindm = $mainMod, mouse:273, resizewindow # help: Resize window by dragging

# Laptop multimedia keys for volume and LCD brightness
# @group Media
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # help: Increase volume
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # help: Decrease volume
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # help: Toggle audio mute
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # help: Toggle microphone mute
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ # help: Increase brightness
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- # help: Decrease brightness

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next # help: Next media track
bindl = , XF86AudioPause, exec, playerctl play-pause # help: Toggle media playback
bindl = , XF86AudioPlay, exec, playerctl play-pause # help: Toggle media playback
bindl = , XF86AudioPrev, exec, playerctl previous # help: Previous media track
