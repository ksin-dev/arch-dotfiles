# Yazi keymap managed by dotfiles.
# `# @group ...` is also used by the Quickshell keybind help overlay.

[mgr]

# @group Navigation
prepend_keymap = [
  { on = [ "h" ], run = "leave", desc = "Go parent directory" },
  { on = [ "l" ], run = "enter", desc = "Open selected directory" },
  { on = [ "j" ], run = "arrow 1", desc = "Move cursor down" },
  { on = [ "k" ], run = "arrow -1", desc = "Move cursor up" },
  { on = [ "g", "g" ], run = "arrow top", desc = "Go to top" },
  { on = [ "G" ], run = "arrow bot", desc = "Go to bottom" },
  { on = [ "~" ], run = "cd ~", desc = "Go home" },

  # @group Selection
  { on = [ "<Space>" ], run = "toggle", desc = "Toggle selection" },
  { on = [ "v" ], run = "visual_mode", desc = "Enter visual selection mode" },
  { on = [ "V" ], run = "visual_mode --unset", desc = "Enter visual unset mode" },

  # @group Files
  { on = [ "o" ], run = "open", desc = "Open selected file" },
  { on = [ "<Enter>" ], run = "open", desc = "Open selected file" },
  { on = [ "a" ], run = "create", desc = "Create file or directory" },
  { on = [ "r" ], run = "rename", desc = "Rename selected file" },
  { on = [ "d" ], run = "remove", desc = "Trash selected files" },
  { on = [ "D" ], run = "remove --permanently", desc = "Permanently delete selected files" },
  { on = [ "y" ], run = "yank", desc = "Yank selected files" },
  { on = [ "x" ], run = "yank --cut", desc = "Cut selected files" },
  { on = [ "p" ], run = "paste", desc = "Paste files" },
  { on = [ "c" ], run = "copy path", desc = "Copy selected file path" },

  # @group Search
  { on = [ "/" ], run = "find --smart", desc = "Search in current directory" },
  { on = [ "?" ], run = "find --previous --smart", desc = "Search backward in current directory" },
  { on = [ "n" ], run = "find_arrow", desc = "Next search result" },
  { on = [ "N" ], run = "find_arrow --previous", desc = "Previous search result" },

  # @group Sort
  { on = [ ",", "m" ], run = "sort modified --reverse=no", desc = "Sort by modified time" },
  { on = [ ",", "n" ], run = "sort natural --reverse=no", desc = "Sort by name" },
  { on = [ ",", "s" ], run = "sort size --reverse=no", desc = "Sort by size" },

  # @group Tabs
  { on = [ "t" ], run = "tab_create --current", desc = "Create tab" },
  { on = [ "1" ], run = "tab_switch 0", desc = "Switch to tab 1" },
  { on = [ "2" ], run = "tab_switch 1", desc = "Switch to tab 2" },
  { on = [ "3" ], run = "tab_switch 2", desc = "Switch to tab 3" },

  # @group System
  { on = [ "q" ], run = "quit", desc = "Quit" },
]
